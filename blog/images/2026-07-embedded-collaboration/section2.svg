<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="800" height="450" fill="#f7f9fc"/>
  <text x="400" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2233">Shared editing on one server-side Book</text>

  <!-- spreadsheet panel -->
  <rect x="140" y="80" width="520" height="290" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="140" y="80" width="520" height="34" rx="12" fill="#217346"/>
  <rect x="140" y="98" width="520" height="16" fill="#217346"/>
  <text x="400" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Shared Book — pushed to all clients</text>

  <!-- column headers -->
  <g fill="#5b6472" font-size="12" text-anchor="middle">
    <text x="210" y="135">A</text><text x="290" y="135">B</text>
    <text x="370" y="135">C</text><text x="450" y="135">D</text><text x="530" y="135">E</text>
  </g>

  <!-- grid -->
  <g stroke="#d0d7de" stroke-width="1">
    <line x1="170" y1="145" x2="630" y2="145"/>
    <line x1="170" y1="185" x2="630" y2="185"/>
    <line x1="170" y1="225" x2="630" y2="225"/>
    <line x1="170" y1="265" x2="630" y2="265"/>
    <line x1="170" y1="305" x2="630" y2="305"/>
    <line x1="250" y1="145" x2="250" y2="305"/>
    <line x1="330" y1="145" x2="330" y2="305"/>
    <line x1="410" y1="145" x2="410" y2="305"/>
    <line x1="490" y1="145" x2="490" y2="305"/>
    <line x1="570" y1="145" x2="570" y2="305"/>
  </g>

  <!-- locked range (padlock cells) -->
  <rect x="490" y="145" width="80" height="160" fill="#217346" opacity="0.10"/>
  <g transform="translate(522,210)">
    <rect x="0" y="6" width="16" height="13" rx="2" fill="#217346"/>
    <path d="M3 6 v-3 a5 5 0 0 1 10 0 v3" fill="none" stroke="#217346" stroke-width="2.5"/>
  </g>
  <text x="530" y="295" text-anchor="middle" font-size="11" fill="#217346">locked</text>

  <!-- client cursors -->
  <g>
    <polygon points="215,170 215,192 222,185 232,185" fill="#1f6feb"/>
    <rect x="226" y="190" width="58" height="16" rx="4" fill="#1f6feb"/>
    <text x="255" y="202" text-anchor="middle" font-size="10" fill="#ffffff">Ana</text>

    <polygon points="295,250 295,272 302,265 312,265" fill="#9b59b6"/>
    <rect x="306" y="270" width="58" height="16" rx="4" fill="#9b59b6"/>
    <text x="335" y="282" text-anchor="middle" font-size="10" fill="#ffffff">Ben</text>

    <polygon points="375,210 375,232 382,225 392,225" fill="#e67e22"/>
    <rect x="386" y="230" width="58" height="16" rx="4" fill="#e67e22"/>
    <text x="415" y="242" text-anchor="middle" font-size="10" fill="#ffffff">Chen</text>
  </g>

  <!-- validation badge -->
  <g transform="translate(195,316)">
    <rect x="0" y="0" width="150" height="26" rx="13" fill="#ffffff" stroke="#1f6feb" stroke-width="1.5"/>
    <circle cx="26" cy="13" r="7" fill="#1f6feb"/>
    <path d="M22 13 l3 3 l6 -7" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="40" y="17" font-size="12" fill="#1a2233">validation rule</text>
  </g>

  <!-- live recalc indicator -->
  <g transform="translate(455,316)">
    <rect x="0" y="0" width="150" height="26" rx="13" fill="#ffffff" stroke="#217346" stroke-width="1.5"/>
    <path d="M34 7 a7 7 0 1 0 6 4" fill="none" stroke="#217346" stroke-width="2"/>
    <polygon points="40,4 42,12 34,11" fill="#217346"/>
    <text x="52" y="17" font-size="12" fill="#1a2233">live formula</text>
  </g>

</svg>
