<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="800" height="450" fill="#f7f9fc"/>
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2233">One context: edit and act on the same screen</text>

  <!-- single flow boundary -->
  <rect x="60" y="84" width="680" height="252" rx="16" fill="#ffffff" stroke="#1f6feb" stroke-width="2.5"/>
  <text x="84" y="114" font-size="15" font-weight="700" fill="#1f6feb">One screen — one flow</text>

  <!-- Panel 1: spreadsheet -->
  <rect x="90" y="140" width="180" height="150" rx="8" fill="#ffffff" stroke="#217346" stroke-width="2"/>
  <rect x="90" y="140" width="180" height="22" rx="8" fill="#217346"/>
  <rect x="90" y="152" width="180" height="10" fill="#217346"/>
  <text x="180" y="156" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Edit the numbers</text>
  <g stroke="#d0d7de" stroke-width="1">
    <line x1="90" y1="192" x2="270" y2="192"/>
    <line x1="90" y1="222" x2="270" y2="222"/>
    <line x1="90" y1="252" x2="270" y2="252"/>
    <line x1="150" y1="162" x2="150" y2="290"/>
    <line x1="210" y1="162" x2="210" y2="290"/>
  </g>
  <rect x="150" y="192" width="60" height="30" fill="none" stroke="#1f6feb" stroke-width="2"/>
  <text x="180" y="308" text-anchor="middle" font-size="12" fill="#5b6472">Excel-like grid</text>

  <line x1="274" y1="215" x2="320" y2="215" stroke="#1f6feb" stroke-width="2.5"/>
  <polygon points="330,215 320,209 320,221" fill="#1f6feb"/>

  <!-- Panel 2: act -->
  <rect x="334" y="150" width="150" height="130" rx="8" fill="#f7f9fc" stroke="#d0d7de" stroke-width="2"/>
  <text x="409" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2233">Act on it</text>
  <rect x="350" y="186" width="118" height="28" rx="14" fill="#217346"/>
  <text x="409" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Submit</text>
  <rect x="350" y="224" width="118" height="28" rx="14" fill="#1f6feb"/>
  <text x="409" y="243" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Approve</text>
  <text x="409" y="308" text-anchor="middle" font-size="12" fill="#5b6472">no second tool</text>

  <line x1="488" y1="215" x2="524" y2="215" stroke="#1f6feb" stroke-width="2.5"/>
  <polygon points="534,215 524,209 524,221" fill="#1f6feb"/>

  <!-- Panel 3: downstream -->
  <rect x="538" y="150" width="172" height="130" rx="8" fill="#f7f9fc" stroke="#d0d7de" stroke-width="2"/>
  <text x="624" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2233">Downstream</text>
  <g transform="translate(560,188)">
    <line x1="8" y1="0" x2="8" y2="14" stroke="#217346" stroke-width="2"/>
    <polygon points="8,18 3,10 13,10" fill="#217346"/>
    <path d="M0 21 h16" stroke="#217346" stroke-width="2"/>
  </g>
  <text x="586" y="204" font-size="12" fill="#5b6472">Export .xlsx</text>
  <g transform="translate(560,224)">
    <circle cx="8" cy="10" r="6" fill="none" stroke="#1f6feb" stroke-width="2"/>
    <circle cx="8" cy="10" r="2" fill="#1f6feb"/>
  </g>
  <text x="586" y="240" font-size="12" fill="#5b6472">Kick off a job</text>
  <text x="624" y="308" text-anchor="middle" font-size="12" fill="#5b6472">same server</text>
</svg>
