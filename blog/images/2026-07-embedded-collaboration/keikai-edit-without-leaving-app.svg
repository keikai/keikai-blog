<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="800" height="450" fill="#f7f9fc"/>
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2233">Edit in the browser — no round trip out of your app</text>

  <!-- Browser window with embedded spreadsheet -->
  <rect x="50" y="80" width="440" height="312" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <path d="M50 92 a12 12 0 0 1 12 -12 h416 a12 12 0 0 1 12 12 v22 h-440 z" fill="#eef1f6"/>
  <circle cx="72" cy="97" r="5" fill="#e06c5b"/>
  <circle cx="90" cy="97" r="5" fill="#e6b34d"/>
  <circle cx="108" cy="97" r="5" fill="#5bb85b"/>
  <rect x="140" y="88" width="330" height="18" rx="9" fill="#ffffff" stroke="#d0d7de"/>
  <text x="152" y="101" font-size="11" fill="#5b6472">yourapp.com/budget</text>

  <rect x="70" y="128" width="400" height="26" fill="#217346"/>
  <text x="80" y="146" font-size="12" font-weight="700" fill="#ffffff">Embedded Keikai spreadsheet</text>

  <rect x="70" y="154" width="400" height="182" fill="#ffffff"/>
  <g stroke="#d0d7de" stroke-width="1">
    <line x1="70" y1="180" x2="470" y2="180"/>
    <line x1="70" y1="206" x2="470" y2="206"/>
    <line x1="70" y1="232" x2="470" y2="232"/>
    <line x1="70" y1="258" x2="470" y2="258"/>
    <line x1="70" y1="284" x2="470" y2="284"/>
    <line x1="70" y1="310" x2="470" y2="310"/>
    <line x1="150" y1="154" x2="150" y2="336"/>
    <line x1="230" y1="154" x2="230" y2="336"/>
    <line x1="310" y1="154" x2="310" y2="336"/>
    <line x1="390" y1="154" x2="390" y2="336"/>
  </g>
  <rect x="70" y="154" width="80" height="182" fill="#f7f9fc"/>
  <line x1="150" y1="154" x2="150" y2="336" stroke="#d0d7de"/>
  <rect x="230" y="206" width="80" height="26" fill="none" stroke="#1f6feb" stroke-width="2"/>
  <line x1="270" y1="211" x2="270" y2="227" stroke="#1f6feb" stroke-width="1.5"/>

  <rect x="250" y="348" width="196" height="30" rx="15" fill="#217346"/>
  <text x="348" y="368" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">You edit right here</text>

  <!-- old round-trip, crossed out -->
  <rect x="560" y="126" width="180" height="48" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="650" y="155" text-anchor="middle" font-size="13" fill="#5b6472">Download .xlsx</text>
  <rect x="560" y="210" width="180" height="48" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="650" y="239" text-anchor="middle" font-size="13" fill="#5b6472">Open desktop Excel</text>
  <rect x="560" y="294" width="180" height="48" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="650" y="323" text-anchor="middle" font-size="13" fill="#5b6472">Re-upload the file</text>
  <line x1="650" y1="174" x2="650" y2="204" stroke="#b5bdc9" stroke-width="2"/>
  <polygon points="650,210 645,201 655,201" fill="#b5bdc9"/>
  <line x1="650" y1="258" x2="650" y2="288" stroke="#b5bdc9" stroke-width="2"/>
  <polygon points="650,294 645,285 655,285" fill="#b5bdc9"/>
  <line x1="556" y1="128" x2="744" y2="342" stroke="#d33" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <line x1="744" y1="128" x2="556" y2="342" stroke="#d33" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <text x="650" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#d33">no download &#8594; edit &#8594; upload</text>
</svg>
