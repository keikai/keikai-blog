<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 425" width="800" height="425" font-family="&#39;Segoe UI&#39;,system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif">
<defs>
 <filter id="ws" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1c2b52" flood-opacity="0.13"></feDropShadow></filter>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"></stop><stop offset="1" stop-color="#fbfbfd"></stop></linearGradient>
</defs>
<rect width="800" height="425" fill="url(#bg)"></rect>
<rect x="24" y="36" width="752" height="353" rx="16" fill="#eef0f6" stroke="#e1e4ef"></rect>

<g filter="url(#ws)"><rect x="46" y="66" width="708" height="293" rx="11" fill="#ffffff" stroke="#e6e8f0"></rect></g>
<path d="M57 66 H743 A11 11 0 0 1 754 77 V96 H46 V77 A11 11 0 0 1 57 66 Z" fill="#1c7a3e"></path>
<text x="66" y="87" font-size="12" font-weight="700" fill="#ffffff">Keikai 7 vs Keikai 6 — large workbooks</text>

<rect x="66" y="112" width="9" height="9" rx="2" fill="#c3cad8"></rect><text x="81" y="120.5" font-size="9.5" fill="#5c6579">Keikai 6</text>
<rect x="142" y="112" width="9" height="9" rx="2" fill="#1c7a3e"></rect><text x="157" y="120.5" font-size="9.5" fill="#5c6579">Keikai 7</text>
<text x="734" y="120.5" text-anchor="end" font-size="9.5" fill="#8a94a8">longer bar = faster</text>
<line x1="66" y1="130" x2="734" y2="130" stroke="#edf0f6"></line>


<text x="66" y="152" font-size="11.5" font-weight="700" fill="#1f2b3d">Opening Excel files</text>
<text x="66" y="167" font-size="9.5" fill="#7a8598">native engine trusts cached values</text>
<rect x="280" y="142" width="50" height="11" rx="5.5" fill="#ccd3e0"></rect>
<rect x="280" y="157" width="350" height="11" rx="5.5" fill="#1c7a3e"></rect>
<text x="734" y="161" text-anchor="end" font-size="14" font-weight="700" fill="#1c7a3e">~7× faster</text>


<text x="66" y="206" font-size="11.5" font-weight="700" fill="#1f2b3d">Saving workbooks</text>
<text x="66" y="221" font-size="9.5" fill="#7a8598">large or formula-dense files</text>
<rect x="280" y="196" width="50" height="11" rx="5.5" fill="#ccd3e0"></rect>
<rect x="280" y="211" width="150" height="11" rx="5.5" fill="#1c7a3e"></rect>
<text x="734" y="215" text-anchor="end" font-size="14" font-weight="700" fill="#1c7a3e">~3× faster</text>


<text x="66" y="260" font-size="11.5" font-weight="700" fill="#1f2b3d">Bulk cell updates</text>
<text x="66" y="275" font-size="9.5" fill="#7a8598">1,000,000 cells</text>
<rect x="280" y="250" width="50" height="11" rx="5.5" fill="#ccd3e0"></rect>
<rect x="280" y="265" width="300" height="11" rx="5.5" fill="#1c7a3e"></rect>
<text x="734" y="269" text-anchor="end" font-size="14" font-weight="700" fill="#1c7a3e">~6× faster</text>


<text x="66" y="314" font-size="11.5" font-weight="700" fill="#1f2b3d">Typing response</text>
<text x="66" y="329" font-size="9.5" fill="#7a8598">reduced input lag</text>
<rect x="280" y="304" width="50" height="11" rx="5.5" fill="#ccd3e0"></rect>
<rect x="280" y="319" width="120" height="11" rx="5.5" fill="#1c7a3e"></rect>
<text x="734" y="323" text-anchor="end" font-size="11.5" font-weight="700" fill="#3d8f5f">more responsive</text>

<line x1="66" y1="340" x2="734" y2="340" stroke="#edf0f6"></line>
<text x="66" y="352" font-size="9" fill="#98a1b4">Compared with Keikai 6 on large workbooks; actual gains vary by file.</text>
</svg>