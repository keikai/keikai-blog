<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 100 1060 1646" font-family="Inter, &#39;Noto Sans&#39;, &#39;Segoe UI&#39;, Arial, sans-serif">
  <defs>
    <g id="i-person" fill="currentColor">
      <circle cx="0" cy="-7" r="7"></circle>
      <path d="M-12,13 C-12,3 -6,1 0,1 C6,1 12,3 12,13 Z"></path>
    </g>
    <g id="i-grid" fill="none" stroke="currentColor" stroke-width="3">
      <rect x="-11" y="-11" width="22" height="22" rx="3"></rect>
      <path d="M-11,-3 H11 M-3,-11 V11"></path>
    </g>
    <g id="i-gear" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round">
      <circle r="6.5"></circle>
      <path d="M0,-10.5 V-15 M0,10.5 V15 M10.5,0 H15 M-10.5,0 H-15 M7.4,-7.4 L10.6,-10.6 M-7.4,7.4 L-10.6,10.6 M7.4,7.4 L10.6,10.6 M-7.4,-7.4 L-10.6,-10.6"></path>
    </g>
    <g id="i-chart" fill="currentColor">
      <rect x="-12" y="-2" width="6.5" height="13" rx="1.5"></rect>
      <rect x="-3.2" y="-11" width="6.5" height="22" rx="1.5"></rect>
      <rect x="5.6" y="-6" width="6.5" height="17" rx="1.5"></rect>
    </g>
    <g id="i-clipboard" fill="none" stroke="currentColor" stroke-width="3">
      <rect x="-11" y="-13" width="22" height="28" rx="3"></rect>
      <rect x="-6" y="-17" width="12" height="7" rx="2" fill="currentColor" stroke="none"></rect>
      <path d="M-5,-4 H6 M-5,3 H6 M-5,10 H2" stroke-linecap="round"></path>
    </g>
    <g id="i-sheet" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round">
      <path d="M-10,-15 H4 L10,-9 V15 H-10 Z"></path>
      <path d="M-5,-2 H5 M-5,4 H5 M-5,10 H5 M0,-2 V10" stroke-width="2.5"></path>
    </g>
    <g id="i-cursor" fill="currentColor">
      <path d="M-6,-8 L-6,11 L-0.8,6.4 L2.4,13.6 L6,12 L2.8,4.9 L9.5,4.6 Z"></path>
      <path d="M-10,-11 L-14,-15 M-2,-12 L-2,-17 M-11,-3 L-16,-3" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path>
    </g>
    <g id="i-db">
      <path fill="currentColor" d="M-12,-10 C-12,-13 -6,-15 0,-15 C6,-15 12,-13 12,-10 V10 C12,13 6,15 0,15 C-6,15 -12,13 -12,10 Z"></path>
      <path d="M-12,-8 C-12,-5 -6,-3 0,-3 C6,-3 12,-5 12,-8 M-12,1 C-12,4 -6,6 0,6 C6,6 12,4 12,1" fill="none" stroke="#FFFFFF" stroke-width="2.5"></path>
    </g>
    <g id="i-calc">
      <rect x="-11" y="-14" width="22" height="28" rx="3" fill="currentColor"></rect>
      <rect x="-7" y="-10" width="14" height="6" rx="1" fill="#FFFFFF"></rect>
      <g fill="#FFFFFF">
        <circle cx="-6" cy="2" r="1.9"></circle><circle cx="0" cy="2" r="1.9"></circle><circle cx="6" cy="2" r="1.9"></circle>
        <circle cx="-6" cy="8" r="1.9"></circle><circle cx="0" cy="8" r="1.9"></circle><circle cx="6" cy="8" r="1.9"></circle>
      </g>
    </g>
    <g id="i-upload" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-12,8 V14 H12 V8"></path>
      <path d="M0,9 V-12 M-7,-5 L0,-13 L7,-5"></path>
    </g>
    <g id="i-doc">
      <path fill="currentColor" d="M-11,-15 H5 L11,-9 V15 H-11 Z"></path>
      <path d="M-5,-4 H5 M-5,2 H5 M-5,8 H5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"></path>
    </g>
    <g id="i-check">
      <circle r="15" fill="currentColor"></circle>
      <path d="M-7,0 L-2,5.5 L8,-5" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
    </g>
    <g id="i-bulb" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0,-15 C7,-15 12,-10 12,-3.5 C12,1 9,4 6.5,6.5 C5.5,7.5 5,9 5,10.5 H-5 C-5,9 -5.5,7.5 -6.5,6.5 C-9,4 -12,1 -12,-3.5 C-12,-10 -7,-15 0,-15 Z"></path>
      <path d="M-4,14.5 H4"></path>
    </g>
    <g id="i-arrow" fill="currentColor">
      <path d="M-5,-18 H5 V0 H12 L0,16 L-12,0 H-5 Z"></path>
    </g>
  </defs>

  <rect x="0" y="0" width="1060" height="1750" fill="#FFFFFF"></rect>

  
  <rect x="100" y="120" width="860" height="154" rx="14" fill="#EDF3FE" stroke="#9DBCF0" stroke-width="1.5"></rect>
  <circle cx="150" cy="160" r="24" fill="#1D4ED8"></circle>
  <use href="#i-person" x="150" y="160" style="color:#FFFFFF"></use>
  <text x="192" y="169" font-size="27" font-weight="700" fill="#1A56DB">Business User</text>
  <rect x="130" y="192" width="800" height="64" rx="12" fill="#FFFFFF" stroke="#C9DAF5" stroke-width="1.5"></rect>
  <use href="#i-clipboard" x="172" y="224" style="color:#1D4ED8"></use>
  <text x="212" y="231" font-size="23" font-weight="600" fill="#212B36">Select a cleansed data sheet from Stage 1</text>

  <use href="#i-arrow" x="530" y="294" style="color:#2563EB"></use>

  
  <rect x="100" y="314" width="860" height="182" rx="14" fill="#EFF8F1" stroke="#9CD3AC" stroke-width="1.5"></rect>
  <circle cx="150" cy="354" r="24" fill="#16A34A"></circle>
  <use href="#i-grid" x="150" y="354" style="color:#FFFFFF"></use>
  <text x="192" y="363" font-size="27" font-weight="700" fill="#15803D">Keikai Workbook</text>
  <rect x="130" y="386" width="800" height="92" rx="12" fill="#FFFFFF" stroke="#C4E5CC" stroke-width="1.5"></rect>
  <use href="#i-sheet" x="172" y="432" style="color:#16A34A"></use>
  <text x="212" y="424" font-size="23" font-weight="600" fill="#212B36">Selected cleansed sheet provides</text>
  <text x="212" y="454" font-size="23" font-weight="600" fill="#212B36">standardized financial data</text>

  <use href="#i-arrow" x="530" y="516" style="color:#2563EB"></use>

  
  <rect x="100" y="536" width="860" height="154" rx="14" fill="#EDF3FE" stroke="#9DBCF0" stroke-width="1.5"></rect>
  <circle cx="150" cy="576" r="24" fill="#1D4ED8"></circle>
  <use href="#i-person" x="150" y="576" style="color:#FFFFFF"></use>
  <text x="192" y="585" font-size="27" font-weight="700" fill="#1A56DB">Business User</text>
  <rect x="130" y="608" width="800" height="64" rx="12" fill="#FFFFFF" stroke="#C9DAF5" stroke-width="1.5"></rect>
  <use href="#i-cursor" x="172" y="640" style="color:#1D4ED8"></use>
  <text x="212" y="647" font-size="23" font-weight="600" fill="#212B36">Click &#34;Generate Journal Entries&#34;</text>

  <use href="#i-arrow" x="530" y="710" style="color:#2563EB"></use>

  
  <rect x="100" y="730" width="860" height="386" rx="14" fill="#F4F1FB" stroke="#C3B2E8" stroke-width="1.5"></rect>
  <circle cx="150" cy="770" r="24" fill="#7C3AED"></circle>
  <use href="#i-gear" x="150" y="770" style="color:#FFFFFF"></use>
  <text x="192" y="779" font-size="27" font-weight="700" fill="#6D28D9">Keikai + ZK Application Process</text>

  <rect x="130" y="802" width="800" height="92" rx="12" fill="#FFFFFF" stroke="#DCD2F0" stroke-width="1.5"></rect>
  <use href="#i-db" x="172" y="848" style="color:#6D28D9"></use>
  <text x="212" y="840" font-size="23" font-weight="600" fill="#212B36">Read selected cleansed data and</text>
  <text x="212" y="870" font-size="23" font-weight="600" fill="#212B36">journal rule tables</text>

  <use href="#i-arrow" x="530" y="906" style="color:#2563EB" transform-origin="530 906" transform="scale(0.6)"></use>

  <rect x="130" y="918" width="800" height="92" rx="12" fill="#FFFFFF" stroke="#DCD2F0" stroke-width="1.5"></rect>
  <use href="#i-calc" x="172" y="964" style="color:#6D28D9"></use>
  <text x="212" y="956" font-size="23" font-weight="600" fill="#212B36">Run calculations, derive reporting metrics,</text>
  <text x="212" y="986" font-size="23" font-weight="600" fill="#212B36">and generate journal rows</text>

  <use href="#i-arrow" x="530" y="1022" style="color:#2563EB" transform-origin="530 1022" transform="scale(0.6)"></use>

  <rect x="130" y="1034" width="800" height="64" rx="12" fill="#FFFFFF" stroke="#DCD2F0" stroke-width="1.5"></rect>
  <use href="#i-upload" x="172" y="1066" style="color:#6D28D9"></use>
  <text x="212" y="1073" font-size="23" font-weight="600" fill="#212B36">Write results back into workbook sheets</text>

  <use href="#i-arrow" x="530" y="1136" style="color:#2563EB"></use>

  
  <rect x="100" y="1156" width="860" height="182" rx="14" fill="#EFF8F1" stroke="#9CD3AC" stroke-width="1.5"></rect>
  <circle cx="150" cy="1196" r="24" fill="#16A34A"></circle>
  <use href="#i-chart" x="150" y="1196" style="color:#FFFFFF"></use>
  <text x="192" y="1205" font-size="27" font-weight="700" fill="#15803D">Output</text>
  <rect x="130" y="1228" width="800" height="92" rx="12" fill="#FFFFFF" stroke="#C4E5CC" stroke-width="1.5"></rect>
  <use href="#i-doc" x="172" y="1274" style="color:#16A34A"></use>
  <text x="212" y="1266" font-size="23" font-weight="600" fill="#212B36">Reveal Journal Entries, Report Impact,</text>
  <text x="212" y="1296" font-size="23" font-weight="600" fill="#212B36">Journal CSV, Report CSV, and Metric CSV</text>

  <use href="#i-arrow" x="530" y="1358" style="color:#2563EB"></use>

  
  <rect x="100" y="1378" width="860" height="182" rx="14" fill="#EDF3FE" stroke="#9DBCF0" stroke-width="1.5"></rect>
  <circle cx="150" cy="1418" r="24" fill="#1D4ED8"></circle>
  <use href="#i-person" x="150" y="1418" style="color:#FFFFFF"></use>
  <text x="192" y="1427" font-size="27" font-weight="700" fill="#1A56DB">Business User</text>
  <rect x="130" y="1450" width="800" height="92" rx="12" fill="#FFFFFF" stroke="#C9DAF5" stroke-width="1.5"></rect>
  <use href="#i-check" x="172" y="1496" style="color:#1D4ED8"></use>
  <text x="212" y="1488" font-size="23" font-weight="600" fill="#212B36">Review generated outputs and</text>
  <text x="212" y="1518" font-size="23" font-weight="600" fill="#212B36">export reporting files</text>

  
  <rect x="100" y="1586" width="860" height="140" rx="16" fill="#EAF2FE" stroke="#1D4ED8" stroke-width="2"></rect>
  <circle cx="162" cy="1656" r="32" fill="#1D4ED8"></circle>
  <use href="#i-bulb" x="162" y="1656" style="color:#FFFFFF"></use>
  <text x="225" y="1628" font-size="23" font-weight="700" fill="#0F2350">Users select cleansed financial data from Stage 1, while</text>
  <text x="225" y="1660" font-size="23" font-weight="700" fill="#0F2350">the Keikai + ZK application process generates journal</text>
  <text x="225" y="1692" font-size="23" font-weight="700" fill="#0F2350">entries and export-ready reporting sheets.</text>
</svg>